<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#4f46e5" />
    <style>
      .prerender {
        max-width: 860px;
        margin: 0 auto;
        padding: 100vh 16px 48px;
        font-family:
          Roboto,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Arial,
          sans-serif;
      }
    </style>
    <script>
      // Aplica el tema antes del primer pintado (sin parpadeo). MUI guarda la preferencia en
      // esta misma clave (THEME_STORAGE_KEY en src/app/theme.ts) y luego toma el control.
      (function () {
        var p = null;
        try {
          p = localStorage.getItem('jsonCleaner.theme');
        } catch (e) {}
        var dark =
          p === 'dark' ||
          (p !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
